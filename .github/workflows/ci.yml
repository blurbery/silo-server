name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOPROXY: https://proxy.golang.org,direct
  GOPRIVATE: github.com/Silo-Server/*
  GONOSUMDB: github.com/Silo-Server/*
  GOLANGCI_LINT_VERSION: v2.12.2

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 4e956e497bdc889552d1fde256130525a7e3f2a7
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-name: test
      - name: Check formatting
        run: test -z "$(gofmt -l internal/recommendations/embeddings/client.go internal/recommendations/embeddings/client_test.go internal/recommendations/similar.go internal/recommendations/similar_quota_test.go)"
      - name: Reproduce unnecessary daily-quota retries before the fix
        shell: bash
        run: |
          trap 'git restore internal/recommendations/embeddings/client.go' EXIT
          git show e6922fb64fd033ef41c104de5bf1013724ec9a56:internal/recommendations/embeddings/client.go > internal/recommendations/embeddings/client.go
          set +e
          go test -count=1 -timeout=2m -run '^TestGeminiDailyQuotaStopsWithoutRetry$' ./internal/recommendations/embeddings/ > "$RUNNER_TEMP/gemini-baseline.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/gemini-baseline.log"
          test "$result" -ne 0
          grep -F 'requests = 6, want 1 for an exhausted daily quota' "$RUNNER_TEMP/gemini-baseline.log"
      - name: Verify corrected quota handling and recommendation unit tests
        run: go test -race -count=20 -timeout=5m ./internal/recommendations/...
      - name: Vet changed packages
        run: go vet ./internal/recommendations/...
      - name: Restore the golangci-lint binary
        id: lint-binary
        uses: actions/cache@v4
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-lint-binary-${{ runner.os }}-${{ env.GOLANGCI_LINT_VERSION }}-${{ hashFiles('go.mod') }}
      - name: Install golangci-lint
        if: steps.lint-binary.outputs.cache-hit != 'true'
        run: go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
      - name: Lint changed packages
        run: make lint-changed BASE_REF=e6922fb64fd033ef41c104de5bf1013724ec9a56
