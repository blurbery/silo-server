name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taste_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d taste_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      SILO_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/taste_test?sslmode=disable
      GOPROXY: https://proxy.golang.org,direct
      GOPRIVATE: github.com/Silo-Server/*
      GONOSUMDB: github.com/Silo-Server/*
    steps:
      - uses: actions/checkout@v5
        with:
          ref: a954ed9f27b00cddf3cf71856eb3e4caeedb8bdf
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-name: test
      - name: Verify the fixed concurrency, isolation, cancellation and rollback paths
        run: go test -race -count=20 -timeout=5m -run '^TestUpsertTasteClusters.*Postgres$' ./internal/recommendations/
      - name: Verify recommendation unit tests
        env:
          SILO_TEST_DATABASE_URL: ""
        run: go test -race -count=1 ./internal/recommendations/...
      - name: Restore the golangci-lint binary
        id: lint-binary
        uses: actions/cache@v4
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-lint-binary-${{ runner.os }}-v2.12.2-${{ hashFiles('go.mod') }}
      - name: Install golangci-lint
        if: steps.lint-binary.outputs.cache-hit != 'true'
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - name: Restore lint analysis cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/golangci-lint
          key: taste-contribution-lint-${{ runner.os }}-a954ed9f
          restore-keys: |
            golangci-lint-cache-${{ runner.os }}-v2.12.2-
      - name: Lint contribution against its upstream base
        env:
          SILO_TEST_DATABASE_URL: ""
        run: golangci-lint run --new-from-merge-base=8d4d1f66c1b092733addd1c36ddb7500a3c20a09 ./...
      - name: Lint router recovery full-tree
        env:
          SILO_TEST_DATABASE_URL: ""
        run: make lint-router-recovery
