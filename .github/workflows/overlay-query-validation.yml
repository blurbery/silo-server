name: Overlay query validation

on:
  push:
    branches:
      - 'codex/**'
    paths:
      - 'internal/sections/overlay_summaries*.go'
      - 'migrations/sql/*overlay*'
      - '.github/workflows/overlay-query-validation.yml'
  workflow_dispatch:
    inputs:
      base_ref:
        description: Commit or ref to compare with the candidate
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: overlay-query-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  overlays:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: silo_test
          POSTGRES_PASSWORD: silo_test
          POSTGRES_DB: silo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U silo_test -d silo_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      SILO_TEST_DATABASE_URL: postgres://silo_test:silo_test@localhost:5432/silo_test?sslmode=disable
      GOPROXY: https://proxy.golang.org,direct
      GOPRIVATE: github.com/Silo-Server/*
      GONOSUMDB: github.com/Silo-Server/*
      GOMAXPROCS: '2'
      GOFLAGS: -p=2
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-name: overlay-query-validation

      - name: Validate migration and formatting
        run: |
          make migrate-validate
          test -z "$(gofmt -l internal/sections/overlay_summaries.go internal/sections/overlay_summaries_test.go)"

      - name: Verify badge correctness, freshness and indexed plans
        run: |
          go test -race -count=1 ./internal/overlays
          go test -race -count=1 -run '^TestOverlaySummaries' ./internal/sections

      - name: Compare the baseline and candidate on identical synthetic data
        env:
          BASE_REF: ${{ inputs.base_ref || 'origin/main' }}
        shell: bash
        run: |
          set -euo pipefail
          source=internal/sections/overlay_summaries.go
          base_commit=$(git rev-parse --verify "${BASE_REF}^{commit}")
          candidate_commit=$(git rev-parse HEAD)
          trap 'git restore --source=HEAD -- "$source"' EXIT

          git show "$base_commit:$source" > "$source"
          if go test -count=1 -run '^TestOverlaySummariesRankedIndexPlan$' ./internal/sections > "$RUNNER_TEMP/overlay-regression.txt" 2>&1; then
            echo 'The baseline already passes the indexed-plan regression test.'
          else
            grep -Eq 'query sorts episode candidates|query does not use idx_media_files_overlay_' "$RUNNER_TEMP/overlay-regression.txt"
          fi
          cat "$RUNNER_TEMP/overlay-regression.txt"
          go test -run '^$' -bench '^BenchmarkOverlaySummaries$' -benchtime=2s -count=3 ./internal/sections | tee "$RUNNER_TEMP/overlay-before.txt"

          git restore --source=HEAD -- "$source"
          go test -run '^$' -bench '^BenchmarkOverlaySummaries$' -benchtime=2s -count=3 ./internal/sections | tee "$RUNNER_TEMP/overlay-after.txt"

          {
            echo "Baseline: $base_commit"
            echo "Candidate: $candidate_commit"
            echo
            echo 'Both runs use the candidate test harness and the same synthetic datasets and indexes. Only the production query implementation changes.'
            echo
            echo 'Baseline:'
            echo '```text'
            cat "$RUNNER_TEMP/overlay-before.txt"
            echo '```'
            echo
            echo 'Candidate:'
            echo '```text'
            cat "$RUNNER_TEMP/overlay-after.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
