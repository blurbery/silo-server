name: Taste cluster regression evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taste_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d taste_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      SILO_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/taste_test?sslmode=disable
      GOPROXY: https://proxy.golang.org,direct
      GOPRIVATE: github.com/Silo-Server/*
      GONOSUMDB: github.com/Silo-Server/*
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-name: test
      - name: Reproduce duplicate cluster keys before the fix
        shell: bash
        run: |
          trap 'git restore internal/recommendations/repo.go' EXIT
          git show aa9fce88fa2900ff71cd4f15318b990202e9d169:internal/recommendations/repo.go > internal/recommendations/repo.go
          set +e
          go test -race -count=1 -run '^TestUpsertTasteClustersConcurrentPostgres$' ./internal/recommendations/ > "$RUNNER_TEMP/taste-baseline.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/taste-baseline.log"
          test "$result" -ne 0
          grep -F 'SQLSTATE 23505' "$RUNNER_TEMP/taste-baseline.log"
          echo 'Baseline reproduced the duplicate-key failure.'
      - name: Verify the fixed concurrency, isolation, cancellation and rollback paths
        run: go test -race -count=20 -timeout=5m -run '^TestUpsertTasteClusters.*Postgres$' ./internal/recommendations/
      - name: Verify recommendation unit tests
        env:
          SILO_TEST_DATABASE_URL: ""
        run: go test -race -count=1 ./internal/recommendations/...
